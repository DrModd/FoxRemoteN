name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FoxRemote.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoxRemote
          path: FoxRemote.apk

      # Свежий APK всегда лежит в релизе "latest" — его удобно качать прямо с телефона
      - name: Publish to release "latest"
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FoxRemote (последняя сборка)
          prerelease: true
          files: FoxRemote.apk
